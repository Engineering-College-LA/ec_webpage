name: Deploy to hoster.kg

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two deploys at once; a newer push cancels the older queued one
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_* values are inlined into the public bundle at build time
      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: hoster
          VITE_APP_BOTPRESS_ID: ${{ secrets.VITE_APP_BOTPRESS_ID }}
          VITE_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_APP_EMAILJS_PUBLIC_KEY }}
          VITE_APP_EMAILJS_SERVICE_ID: ${{ secrets.VITE_APP_EMAILJS_SERVICE_ID }}
          VITE_APP_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_APP_EMAILJS_TEMPLATE_ID }}
          VITE_APP_GOOGLE_SHEETS_API_URL: ${{ secrets.VITE_APP_GOOGLE_SHEETS_API_URL }}
          VITE_APP_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APP_RECAPTCHA_SITE_KEY }}
          VITE_APP_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_APP_TELEGRAM_BOT_TOKEN }}
          VITE_APP_TELEGRAM_CHAT_ID: ${{ secrets.VITE_APP_TELEGRAM_CHAT_ID }}

      - name: Upload dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          # e.g. /www/example.kg/ ; must end with a slash
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 https://college.edu.kg/ | grep -q '<div id="root"'
          curl -fsS https://college.edu.kg/locales/en/translation.json > /dev/null
