<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Engineering College LA</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When a user navigates directly to a sub-path (e.g. /ec_webpage/about),
      // GitHub Pages returns a 404. This page catches that 404 and redirects
      // to the root index.html while preserving the original path in the query
      // string, which the app then reads to restore the correct route.
      var segmentCount = 1; // number of path segments in the repo name (/ec_webpage)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
